<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>EduAventura</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4facfe">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="img/icono-192.png">
<link rel="apple-touch-icon" href="img/icono-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2196f3">

<style>
body{
    margin:0;
    font-family:'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.pantalla{ display:none; }
.activa{ display:block; }

.card{
    background:white;
    width:430px;
    max-width:95%;
    padding:35px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 20px 40px rgba(0,0,0,0.25);
}

.titulo{ font-size:38px; }

.buho{ width:150px; margin:15px 0; }

.input-nombre{
    width:100%;
    padding:12px;
    border-radius:25px;
    border:none;
    background:#f1f3f6;
    text-align:center;
    font-size:16px;
}

.btn{
    margin-top:12px;
    width:100%;
    padding:12px;
    border:none;
    border-radius:25px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{ transform:scale(1.05); }

ul{ list-style:none; padding:0; }

ul li{
    background:#4facfe;
    margin:8px 0;
    padding:10px;
    border-radius:20px;
    color:white;
    cursor:pointer;
}

ul li:hover{ background:#00c9ff; }

.opcion{
    background:#eee;
    margin:8px 0;
    padding:10px;
    border-radius:15px;
    cursor:pointer;
}

.opcion:hover{
    background:#4facfe;
    color:white;
}

.barra{
    width:100%;
    background:#ddd;
    height:15px;
    border-radius:20px;
    margin-bottom:15px;
}

.progreso{
    height:15px;
    width:0%;
    background:linear-gradient(90deg,#00c9ff,#92fe9d);
    border-radius:20px;
    transition:0.4s;
}

.ganador{
    font-size:24px;
    color:#28a745;
    animation: brillo 1s infinite alternate;
}

@keyframes brillo{
    from{ transform:scale(1);}
    to{ transform:scale(1.1);}
}


</style>
</head>
<body>

<!-- INICIO -->
<div id="inicio" class="pantalla activa">
<div class="card">
<h1 class="titulo">🦉 EduAventura</h1>
<img class="buho" src="https://cdn-icons-png.flaticon.com/512/3069/3069172.png">
<input type="text" id="nombreJugador" class="input-nombre" placeholder="Escribe tu nombre...">
<button class="btn" onclick="irMaterias()">🎮 Jugar</button>
<button class="btn" onclick="irInstrucciones()">📖 Instrucciones</button>
</div>
</div>

<!-- INSTRUCCIONES -->
<div id="instrucciones" class="pantalla">
<div class="card">
<h2>📖 Instrucciones</h2>
<p>
✔ Escribe tu nombre<br>
✔ Elige una materia<br>
✔ Responde 10 preguntas<br>
✔ Completa las 4 materias<br>
✔ Luego realiza la Evaluación Final
</p>
<button class="btn" onclick="volverInicio()">⬅ Volver</button>
</div>
</div>

<!-- MATERIAS -->
<div id="materias" class="pantalla">
<div class="card">
<h2>📚 Selecciona</h2>
<ul>
<li onclick="iniciarJuego('matematicas')">Matemáticas</li>
<li onclick="iniciarJuego('espanol')">Español</li>
<li onclick="iniciarJuego('ingles')">Inglés</li>
<li onclick="iniciarJuego('ciencias')">Ciencias</li>
<li onclick="iniciarEvaluacionFinal()">🏆 Evaluación Final</li>
</ul>
<button class="btn" onclick="volverInicio()">⬅ Volver</button>
</div>
</div>

<!-- PREGUNTAS -->
<div id="preguntas" class="pantalla">
<div class="card">
<h2 id="tituloMateria"></h2>
<div class="barra"><div id="progreso" class="progreso"></div></div>
<p id="preguntaTexto"></p>
<div id="opciones"></div>
<p id="puntos"></p>
</div>
</div>

<!-- GANADOR -->
<div id="ganador" class="pantalla">
<div class="card">
<h2 class="ganador">🎉 ¡FELICIDADES! 🎉</h2>
<p id="resultadoFinal"></p>
<button class="btn" onclick="volverInicio()">🏠 Volver al inicio</button>
</div>
</div>

<script>
const preguntasBase = {
matematicas:[{p:"5 x 6?",r:["30","25","20","35"],c:0},{p:"9 + 8?",r:["15","16","17","18"],c:2},{p:"12 ÷ 3?",r:["2","3","4","6"],c:2},{p:"7 x 7?",r:["42","49","56","36"],c:1},{p:"15 - 9?",r:["5","6","7","8"],c:1},{p:"3²?",r:["6","9","3","12"],c:1},{p:"10% de 100?",r:["5","10","20","15"],c:1},{p:"Raíz de 16?",r:["2","4","6","8"],c:1},{p:"20 + 30?",r:["40","45","50","60"],c:2},{p:"100 ÷ 10?",r:["5","10","15","20"],c:1}],
espanol:[{p:"Sinónimo de feliz?",r:["Triste","Contento","Solo","Cansado"],c:1},{p:"Antónimo de alto?",r:["Grande","Bajo","Ancho","Fuerte"],c:1},{p:"Plural de luz?",r:["Luces","Luzes","Luzs","Luce"],c:0},{p:"Palabra aguda?",r:["Casa","Perro","Canción","Mesa"],c:2},{p:"Verbo en pasado?",r:["Correrá","Corrió","Corre","Corriendo"],c:1},{p:"Artículo definido?",r:["Un","Una","El","Al"],c:2},{p:"Sujeto en oración?",r:["Acción","Persona que realiza acción","Lugar","Objeto"],c:1},{p:"Palabra esdrújula?",r:["Lápiz","Camión","Árbol","Pájaro"],c:3},{p:"Signo de interrogación?",r:["!","¿",";","."],c:1},{p:"Sinónimo de rápido?",r:["Lento","Veloz","Débil","Frío"],c:1}],
ingles:[{p:"Dog?",r:["Gato","Perro","Caballo","Ratón"],c:1},{p:"Red?",r:["Rojo","Azul","Verde","Amarillo"],c:0},{p:"Apple?",r:["Pera","Manzana","Uva","Melón"],c:1},{p:"Book?",r:["Libro","Mesa","Puerta","Silla"],c:0},{p:"Sun?",r:["Luna","Sol","Estrella","Nube"],c:1},{p:"Blue?",r:["Rojo","Azul","Negro","Blanco"],c:1},{p:"Cat?",r:["Perro","Gato","Pájaro","Pez"],c:1},{p:"Water?",r:["Agua","Fuego","Aire","Tierra"],c:0},{p:"House?",r:["Casa","Carro","Escuela","Calle"],c:0},{p:"Happy?",r:["Triste","Enojado","Feliz","Cansado"],c:2}],
ciencias:[{p:"Planeta rojo?",r:["Venus","Marte","Júpiter","Saturno"],c:1},{p:"H2O es?",r:["Fuego","Aire","Agua","Tierra"],c:2},{p:"Órgano que bombea sangre?",r:["Pulmón","Hígado","Corazón","Riñón"],c:2},{p:"Animal mamífero?",r:["Gallina","Perro","Lagarto","Pez"],c:1},{p:"Energía del sol?",r:["Solar","Eólica","Hídrica","Nuclear"],c:0},{p:"Gas que respiramos?",r:["CO2","Oxígeno","Helio","Nitrógeno"],c:1},{p:"Estado sólido?",r:["Agua","Hielo","Vapor","Gas"],c:1},{p:"Parte de planta?",r:["Raíz","Rueda","Motor","Pantalla"],c:0},{p:"Satélite natural Tierra?",r:["Sol","Luna","Marte","Venus"],c:1},{p:"Fuerza que atrae?",r:["Magnetismo","Gravedad","Electricidad","Calor"],c:1}]
};

let preguntas = [];
let indice = 0;
let puntosTotales = 0;
let materiaActual = "";
let materiasCompletadas = [];

function ocultarTodo(){
document.querySelectorAll(".pantalla").forEach(p=>p.classList.remove("activa"));
}

function irInstrucciones(){
ocultarTodo();
document.getElementById("instrucciones").classList.add("activa");
}

function irMaterias(){
const nombre = document.getElementById("nombreJugador").value.trim();
if(nombre===""){ alert("Escribe tu nombre"); return; }
ocultarTodo();
document.getElementById("materias").classList.add("activa");
}

function volverInicio(){
materiasCompletadas=[];
puntosTotales=0;
ocultarTodo();
document.getElementById("inicio").classList.add("activa");
}

function iniciarJuego(m){
if(materiasCompletadas.includes(m)){
alert("Ya completaste esta materia");
return;
}
preguntas=[...preguntasBase[m]];
materiaActual=m;
indice=0;
ocultarTodo();
document.getElementById("preguntas").classList.add("activa");
document.getElementById("tituloMateria").innerText="Materia: "+m;
mostrarPregunta();
}

function iniciarEvaluacionFinal(){
if(materiasCompletadas.length<4){
alert("Debes completar las 4 materias primero");
return;
}
preguntas=[
...preguntasBase.matematicas.slice(0,3),
...preguntasBase.espanol.slice(0,3),
...preguntasBase.ingles.slice(0,2),
...preguntasBase.ciencias.slice(0,2)
];
materiaActual="final";
indice=0;
ocultarTodo();
document.getElementById("preguntas").classList.add("activa");
document.getElementById("tituloMateria").innerText="🏆 Evaluación Final";
mostrarPregunta();
}

function mostrarPregunta(){
const pregunta=preguntas[indice];
document.getElementById("preguntaTexto").innerText=pregunta.p;
const opcionesDiv=document.getElementById("opciones");
opcionesDiv.innerHTML="";
pregunta.r.forEach((op,i)=>{
const div=document.createElement("div");
div.className="opcion";
div.innerText=op;
div.onclick=()=>responder(i);
opcionesDiv.appendChild(div);
});
document.getElementById("puntos").innerText="Puntos totales: "+puntosTotales;
document.getElementById("progreso").style.width=(indice/10)*100+"%";
}

function responder(i){
if(i===preguntas[indice].c){ puntosTotales+=10; }
indice++;
if(indice<10){
mostrarPregunta();
}else{
document.getElementById("progreso").style.width="100%";
terminarMateria();
}
}

function terminarMateria(){
if(materiaActual!=="final"){
materiasCompletadas.push(materiaActual);
alert("Materia completada. Elige otra.");
ocultarTodo();
document.getElementById("materias").classList.add("activa");
}else{
mostrarGanador();
}
}

function mostrarGanador(){
ocultarTodo();
document.getElementById("ganador").classList.add("activa");
const nombre=document.getElementById("nombreJugador").value;
document.getElementById("resultadoFinal").innerText=
nombre+" obtuviste "+puntosTotales+" puntos totales.";
}
</script>

<!-- REGISTRO SERVICE WORKER -->
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("sw.js")
      .then(function() {
        console.log("Service Worker registrado correctamente");
      });
  });
}
</script>

</body>
</html>
